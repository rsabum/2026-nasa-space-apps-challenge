site: story_county_ia
note: >-
  Parameters of the SYNTHETIC world served by the local mock services. Every section has a
  provenance line. "PLACEHOLDER" values are hand-set to look plausible for development only;
  replace them with fits to real data before drawing any agronomic conclusion.
  The fitted weather parameters live in story_county_ia.weather.yaml (generated).
world:
  start_year: 1981
  end_year: 2025
  # Names the mock NASS / Census services report for the site (match config.yaml).
  state_name: IOWA
  county_name: STORY
  county_fips: '169'
  asd_code: '50'
  asd_desc: CENTRAL
soilwater:
  provenance: 'PLACEHOLDER: bucket shape only; output is rescaled to the fitted POWER GWET statistics'
  top_capacity_mm: 25.0
  root_capacity_mm: 200.0
  top_drainage_per_day: 0.08
  root_drainage_per_day: 0.01
yields:
  provenance: 'PLACEHOLDER: replace with real fit to NASS county yields'
  trend_start_year: 2001
  # yield = (base + trend * (year - trend_start_year)) * (1 + water * z_water - heat * z_heat) + noise
  crops:
    corn:         {base: 150.0, trend_per_year: 2.0,  noise_sd: 10.0, water: 0.06, heat: 0.05, missing_year_prob: 0.0,  suppressed_prob: 0.0}
    soybeans:     {base: 45.0,  trend_per_year: 0.5,  noise_sd: 3.5,  water: 0.05, heat: 0.03, missing_year_prob: 0.0,  suppressed_prob: 0.0}
    oats:         {base: 70.0,  trend_per_year: 0.4,  noise_sd: 8.0,  water: 0.03, heat: 0.04, missing_year_prob: 0.15, suppressed_prob: 0.05}
    winter_wheat: {base: 55.0,  trend_per_year: 0.6,  noise_sd: 7.0,  water: 0.02, heat: 0.02, missing_year_prob: 0.4,  suppressed_prob: 0.1}
    alfalfa:      {base: 4.0,   trend_per_year: 0.01, noise_sd: 0.4,  water: 0.05, heat: 0.02, missing_year_prob: 0.05, suppressed_prob: 0.0}
prices:
  provenance: 'PLACEHOLDER: replace with real fit to NASS Iowa prices received'
  # log(price) follows AR(1) around log(level): x_t = phi * x_{t-1} + sigma * eps
  crops:
    corn:         {level: 4.0,   phi: 0.7, sigma: 0.18}
    soybeans:     {level: 10.0,  phi: 0.7, sigma: 0.15}
    oats:         {level: 2.8,   phi: 0.6, sigma: 0.18}
    winter_wheat: {level: 5.5,   phi: 0.6, sigma: 0.18}
    alfalfa:      {level: 150.0, phi: 0.6, sigma: 0.15}
fields:
  provenance: 'PLACEHOLDER: layout and rotation probabilities hand-set for development'
  section_m: 1609.34          # PLSS section (1 mile); roads follow section lines
  road_width_m: 20.0
  half_split_prob: 0.35       # chance a quarter-section is split into two fields
  farmstead_prob: 0.5         # chance a section has a farmstead
  grass_field_prob: 0.05      # chance a field is permanent grass/pasture
  misclass_prob: 0.03         # per-pixel CDL classification noise
  start_year: 1997
  # P(next main crop | this year's main crop). Rows sum to 1.
  rotation:
    corn:         {corn: 0.20, soybeans: 0.74, oats: 0.03, winter_wheat: 0.02, alfalfa: 0.01, cereal_rye: 0.0}
    soybeans:     {corn: 0.86, soybeans: 0.05, oats: 0.04, winter_wheat: 0.03, alfalfa: 0.0,  cereal_rye: 0.02}
    oats:         {corn: 0.40, soybeans: 0.0,  oats: 0.0,  winter_wheat: 0.0,  alfalfa: 0.60, cereal_rye: 0.0}
    winter_wheat: {corn: 0.50, soybeans: 0.50, oats: 0.0,  winter_wheat: 0.0,  alfalfa: 0.0,  cereal_rye: 0.0}
    alfalfa:      {corn: 0.40, soybeans: 0.0,  oats: 0.0,  winter_wheat: 0.0,  alfalfa: 0.60, cereal_rye: 0.0}
    cereal_rye:   {corn: 0.30, soybeans: 0.70, oats: 0.0,  winter_wheat: 0.0,  alfalfa: 0.0,  cereal_rye: 0.0}
soils:
  provenance: >-
    PLACEHOLDER: series names are common in Story County, Iowa (names only); every property
    value is hand-set for development and is NOT taken from SSURGO
  n_cells: 30                 # Voronoi cells over a 6 km square around the site
  # Series chosen by relative elevation of each cell (lowest first).
  by_relative_elevation: [canisteo, webster, harps, nicollet, clarion]
  inclusion_pct: 15           # minor component share in each map unit
  series:
    clarion:
      musym: 138B
      muname: Clarion loam, 2 to 5 percent slopes
      drainagecl: Well drained
      hydgrp: B
      slope: [2, 3, 5]
      horizons:   # [hzname, top_cm, bottom_cm, awc, om_pct, sand, silt, clay, kwfact]
        - [Ap, 0, 20, 0.20, 3.5, 40, 36, 24, '.24']
        - [Bw, 20, 75, 0.17, 1.0, 42, 34, 24, '.28']
        - [C, 75, 152, 0.15, 0.3, 44, 33, 23, '.32']
    nicollet:
      musym: '55'
      muname: Nicollet loam, 1 to 3 percent slopes
      drainagecl: Somewhat poorly drained
      hydgrp: B/D
      slope: [1, 2, 3]
      horizons:
        - [Ap, 0, 23, 0.21, 4.5, 36, 38, 26, '.24']
        - [Bg, 23, 81, 0.18, 1.2, 38, 36, 26, '.28']
        - [C, 81, 152, 0.16, 0.4, 42, 34, 24, '.32']
    webster:
      musym: '107'
      muname: Webster clay loam, 0 to 2 percent slopes
      drainagecl: Poorly drained
      hydgrp: C/D
      slope: [0, 1, 2]
      horizons:
        - [Ap, 0, 23, 0.20, 6.0, 30, 38, 32, '.20']
        - [Bg, 23, 89, 0.17, 1.5, 34, 36, 30, '.24']
        - [Cg, 89, 152, 0.16, 0.5, 38, 36, 26, '.28']
    canisteo:
      musym: '507'
      muname: Canisteo clay loam, 0 to 2 percent slopes
      drainagecl: Poorly drained
      hydgrp: C/D
      slope: [0, 1, 2]
      horizons:
        - [Ap, 0, 25, 0.19, 6.5, 30, 38, 32, '.20']
        - [Bg, 25, 76, 0.17, 1.8, 32, 38, 30, '.24']
        - [Cg, 76, 152, 0.16, 0.6, 36, 38, 26, '.28']
    harps:
      musym: '95'
      muname: Harps clay loam, 0 to 2 percent slopes
      drainagecl: Poorly drained
      hydgrp: C/D
      slope: [0, 1, 2]
      horizons:
        - [Ap, 0, 23, 0.18, 5.5, 32, 38, 30, '.24']
        - [Bkg, 23, 74, 0.16, 1.5, 36, 36, 28, '.28']
        - [Ckg, 74, 152, 0.15, 0.5, 40, 35, 25, '.32']
terrain:
  provenance: 'PLACEHOLDER: synthetic gently rolling surface; base elevation = POWER site elevation'
  tilt_m_per_km: [0.3, -0.4]  # east, north gradient
  n_swales: 8
  swale_depth_m: [2.0, 5.0]
  swale_width_m: [50.0, 120.0]
  swale_length_m: [1500.0, 4000.0]
  n_knolls: 35
  knoll_height_m: [2.0, 6.0]
  knoll_radius_m: [70.0, 200.0]
  noise_amplitude_m: 0.6
  tnm_tile_half_size_deg: 0.05  # mock 3DEP tile is a subset around the site, not a full 1x1 degree tile
