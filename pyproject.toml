[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift"
version = "0.1.0"
description = "Field Shift: crop-rotation planner using NASA data (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "numpy>=1.26",
    "xarray>=2024.1",
    "earthaccess>=0.9",
    "rasterio>=1.3.9",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Added: local mock services that imitate the real APIs during development.
    "flask>=3.0",
    # Added: WKT <-> GeoJSON and polygon clipping for SSURGO map units.
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"field_shift.mock" = ["params/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits real external APIs (deselected by default; run with -m network)"]
addopts = "-m 'not network'"
filterwarnings = [
    "ignore::DeprecationWarning:earthaccess.*",
    "ignore::PendingDeprecationWarning:rasterio.*",  # rasterio uses Affine * (fixed upstream)
]
