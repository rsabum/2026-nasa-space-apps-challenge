<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Field Shift logo">
  <defs>
    <!-- tile: NASA blue fading into deep-space navy -->
    <linearGradient id="fsl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A55C4"/>
      <stop offset=".55" stop-color="#0B3D91"/>
      <stop offset="1" stop-color="#0A0E1F"/>
    </linearGradient>
    <radialGradient id="fsl-glow" cx=".8" cy=".15" r=".6">
      <stop offset="0" stop-color="#8FB4FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8FB4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fsl-stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9CCFF"/>
    </linearGradient>
    <!-- flutes: mint, NASA blue, NASA red -->
    <linearGradient id="fsl-mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6F2DB"/>
      <stop offset="1" stop-color="#2FA98A"/>
    </linearGradient>
    <linearGradient id="fsl-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4D6FF"/>
      <stop offset="1" stop-color="#4F8BFF"/>
    </linearGradient>
    <linearGradient id="fsl-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA58F"/>
      <stop offset="1" stop-color="#FC3D21"/>
    </linearGradient>
    <linearGradient id="fsl-leaf-l" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2FA98A"/>
      <stop offset="1" stop-color="#A6F2DB"/>
    </linearGradient>
    <linearGradient id="fsl-leaf-r" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5DD6B0"/>
      <stop offset="1" stop-color="#8FB4FF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#fsl-bg)"/>
  <rect width="64" height="64" rx="12" fill="url(#fsl-glow)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="11.5" fill="none" stroke="#8FB4FF" stroke-opacity=".45"/>
  <!-- sprout -->
  <path d="M32 20 C32 13.5 27.5 10 22.5 9.5 C22.5 15 26.5 20 32 20Z" fill="url(#fsl-leaf-l)"/>
  <path d="M32 20 C32 13.5 36.5 10 41.5 9.5 C41.5 15 37.5 20 32 20Z" fill="url(#fsl-leaf-r)"/>
  <!-- capital -->
  <rect x="14" y="21" width="36" height="5" rx="1.5" fill="url(#fsl-stone)"/>
  <!-- flutes: three crops in rotation -->
  <rect x="18.5" y="29.5" width="7" height="19" rx="2" fill="url(#fsl-mint)"/>
  <rect x="28.5" y="29.5" width="7" height="19" rx="2" fill="url(#fsl-blue)"/>
  <rect x="38.5" y="29.5" width="7" height="19" rx="2" fill="url(#fsl-red)"/>
  <!-- base -->
  <rect x="14" y="52" width="36" height="5" rx="1.5" fill="url(#fsl-stone)"/>
</svg>
