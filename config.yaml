# Field Shift configuration. All locations and endpoints come from this file.

site:
  name: story_county_ia
  lat: 42.03
  lon: -93.47
  bbox_km: 2.0            # side length of the square box centred on the site
  state_alpha: IA
  state_fips: "19"
  county_fips: "169"      # Story County. Leave empty ("") to look it up with the Census geocoder.

years:
  start: 2001
  end: 2025

crops:
  cash: [corn, soybeans, oats, winter_wheat, alfalfa]
  cover: [cereal_rye]

cdl:
  start_year: 2008        # CDL coverage for Iowa used by this project

terrain:
  # Try in order; 3DEP is the backup when there is no Earthdata login.
  sources: [srtm, 3dep]
  # Slope-zone class breaks in percent. These are the SSURGO map-unit slope phases
  # (0-2, 2-5, 5-9, 9-14, >14 %), e.g. "Clarion loam, 2 to 5 percent slopes".
  slope_zone_breaks_pct: [2, 5, 9, 14]

endpoints:
  mode: mock              # mock | real
  mock_base_url: http://127.0.0.1:8765
  real:
    power: https://power.larc.nasa.gov
    nass: https://quickstats.nass.usda.gov
    cdl_point: https://nassgeodata.gmu.edu
    cdl_image: https://pdi.scinet.usda.gov
    sda: https://sdmdataaccess.sc.egov.usda.gov
    cmr: https://cmr.earthdata.nasa.gov
    tnm: https://tnmaccess.nationalmap.gov
    census: https://geocoding.geo.census.gov

http:
  timeout_s: 120          # read timeout per request (CropScape can be slow)
  sleep_between_requests_s: 1.0   # politeness delay between paged/repeated calls (real mode)

mock:
  seed: 42
  params: story_county_ia.yaml    # file in src/field_shift/mock/params/
  sleep_between_requests_s: 0.0   # no need to be polite to ourselves

checks:
  # Rough reality-check bounds for central Iowa, used only to print warnings.
  # They are deliberately wide and are NOT agronomic parameters.
  annual_precip_mm: [450, 1500]
  annual_et0_mm: [650, 1400]

paths:
  data_dir: data
  reference_dir: data/reference
